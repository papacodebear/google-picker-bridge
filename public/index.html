<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Google Drive Picker</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
</style>
</head>
<body>
<script>
(function () {
  // Popup bridge: extension to Picker via URL hash, own OAuth for cookie isolation.

  var PAYLOAD_KEY = 'keetar-picker-payload';
  var TOKEN_KEY = 'keetar-picker-token';
  var STATE_KEY = 'keetar-picker-state';
  var AUTH_RETURN_URL = 'https://google-picker-bridge.papacodebear.workers.dev/auth-return.html';
  var TOKEN_EXPIRY_MARGIN_MS = 60000;
  var REDIRECT_URI_KEY = 'keetar-picker-redirect-uri';

  // Page enters either fresh (payload in hash) or post-auth (payload from sessionStorage).
  function loadPayload() {
    var raw = window.location.hash.slice(1);
    if (raw) {
      try {
        var parsed = JSON.parse(decodeURIComponent(raw));
        sessionStorage.setItem(PAYLOAD_KEY, JSON.stringify(parsed));
        return parsed;
      } catch (e) {
        console.error('[bridge] failed to parse hash payload:', e);
        return null;
      }
    }
    var stored = sessionStorage.getItem(PAYLOAD_KEY);
    return stored ? JSON.parse(stored) : null;
  }

  var payload = loadPayload();
  if (!payload || !payload.developerKey || !payload.callbackUrl || !payload.clientId || !payload.scope) {
    document.body.textContent = 'Missing or invalid Picker parameters.';
    throw new Error('google-picker-bridge: missing or invalid payload');
  }

  function goToCallback(result) {
    window.location.href = payload.callbackUrl + '#' + encodeURIComponent(JSON.stringify(result));
  }

  function getCachedAccessToken() {
    var raw = sessionStorage.getItem(TOKEN_KEY);
    if (!raw) {
      return null;
    }
    try {
      var token = JSON.parse(raw);
      if (token.accessToken && token.expiresAt && Date.now() < token.expiresAt - TOKEN_EXPIRY_MARGIN_MS) {
        return token.accessToken;
      }
    } catch (e) {
      console.error('[bridge] failed to parse cached token:', e);
    }
    return null;
  }

  function redirectToGoogleAuth() {
    var state = (crypto.randomUUID && crypto.randomUUID()) || String(Math.random()).slice(2);
    sessionStorage.setItem(STATE_KEY, state);
    // Stashed as-is since window.location loses the .html Google actually saw.
    sessionStorage.setItem(REDIRECT_URI_KEY, AUTH_RETURN_URL);
    var authUrl = new URL('https://accounts.google.com/o/oauth2/v2/auth');
    authUrl.searchParams.set('client_id', payload.clientId);
    authUrl.searchParams.set('redirect_uri', AUTH_RETURN_URL);
    authUrl.searchParams.set('response_type', 'code');
    authUrl.searchParams.set('scope', payload.scope);
    authUrl.searchParams.set('state', state);
    window.location.href = authUrl.toString();
  }

  var pickerApiPromise = null;
  function loadPickerApi() {
    if (!pickerApiPromise) {
      pickerApiPromise = new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = 'https://apis.google.com/js/api.js';
        script.onload = function () {
          window.gapi.load('picker', { callback: resolve, onerror: reject });
        };
        script.onerror = function () {
          reject(new Error('failed to load https://apis.google.com/js/api.js'));
        };
        document.head.appendChild(script);
      });
    }
    return pickerApiPromise;
  }

  function showPicker(accessToken) {
    loadPickerApi().then(function () {
      var picker = window.google.picker;
      var view = new picker.DocsView(picker.ViewId.DOCS).setIncludeFolders(false).setSelectFolderEnabled(false);
      // Without setAppId, Picker returns a fileId but the caller's Drive API calls 404.
      var builder = new picker.PickerBuilder()
        .addView(view)
        .setOAuthToken(accessToken)
        .setDeveloperKey(payload.developerKey);
      if (payload.appId) {
        builder = builder.setAppId(payload.appId);
      }
      builder
        .setCallback(function (data) {
          if (data.action === picker.Action.PICKED) {
            var doc = data.docs && data.docs[0];
            goToCallback({ fileId: doc ? doc.id : undefined, name: doc ? doc.name : undefined });
          } else if (data.action === picker.Action.CANCEL) {
            goToCallback({ fileId: undefined });
          }
        })
        .build()
        .setVisible(true);
    }).catch(function (e) {
      console.error('[bridge] error loading Picker:', e);
      goToCallback({ error: String((e && e.message) || e) });
    });
  }

  var cachedAccessToken = getCachedAccessToken();
  if (cachedAccessToken) {
    showPicker(cachedAccessToken);
  } else {
    redirectToGoogleAuth();
  }
})();
</script>
</body>
</html>
