<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Google Drive Picker</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; }
</style>
</head>
<body>
<script>
(function () {
  // Bridges a browser extension (moz-extension:// / chrome-extension://
  // origin) to Google's Picker widget, which this page loads the normal,
  // fully-documented way (live from apis.google.com) — no vendoring, no
  // interception. That's deliberate: the REMOTE_SCRIPT restriction the
  // extension itself works around (see google-picker-offline-loader) is
  // about code shipped *inside* an extension bundle, not an external
  // website the extension merely embeds via iframe. This page exists
  // specifically because Google's Picker backend, confirmed live, accepts
  // a real https:// origin (and, oddly, chrome-extension://) but rejects
  // moz-extension:// outright with a genuine server-side 403 — this page
  // gives Firefox's side of that flow a real https:// origin to run from.
  //
  // Protocol (window.postMessage, both directions):
  //   -> {type: 'keetar-picker-show', accessToken, developerKey}
  //   <- {type: 'keetar-picker-ready'}                              (on load)
  //   <- {type: 'keetar-picker-result', fileId?, name?}             (on pick/cancel)
  //   <- {type: 'keetar-picker-error', message}                     (on failure)
  //
  // Trust model: incoming messages are checked against an extension-scheme
  // origin before being acted on. Replies always go back via
  // event.source.postMessage(data, event.origin) — both browser-verified,
  // unspoofable properties of the received message — rather than a
  // hardcoded target, so this works correctly for whichever specific
  // extension ID/browser actually opened it without needing to know that
  // in advance.

  function isTrustedOrigin(origin) {
    return origin.indexOf('chrome-extension://') === 0 || origin.indexOf('moz-extension://') === 0;
  }

  var pickerApiPromise = null;
  function loadPickerApi() {
    if (!pickerApiPromise) {
      pickerApiPromise = new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = 'https://apis.google.com/js/api.js';
        script.onload = function () {
          window.gapi.load('picker', { callback: resolve, onerror: reject });
        };
        script.onerror = function () {
          reject(new Error('failed to load https://apis.google.com/js/api.js'));
        };
        document.head.appendChild(script);
      });
    }
    return pickerApiPromise;
  }

  window.addEventListener('message', function (event) {
    if (!isTrustedOrigin(event.origin) || !event.data || event.data.type !== 'keetar-picker-show') {
      return;
    }
    var accessToken = event.data.accessToken;
    var developerKey = event.data.developerKey;
    var source = event.source;
    var origin = event.origin;

    loadPickerApi().then(function () {
      var picker = window.google.picker;
      var view = new picker.DocsView(picker.ViewId.DOCS).setIncludeFolders(false).setSelectFolderEnabled(false);
      new picker.PickerBuilder()
        .addView(view)
        .setOAuthToken(accessToken)
        .setDeveloperKey(developerKey)
        .setCallback(function (data) {
          if (data.action === picker.Action.PICKED) {
            var doc = data.docs && data.docs[0];
            source.postMessage(
              { type: 'keetar-picker-result', fileId: doc ? doc.id : undefined, name: doc ? doc.name : undefined },
              origin
            );
          } else if (data.action === picker.Action.CANCEL) {
            source.postMessage({ type: 'keetar-picker-result', fileId: undefined }, origin);
          }
        })
        .build()
        .setVisible(true);
    }).catch(function (e) {
      source.postMessage({ type: 'keetar-picker-error', message: String((e && e.message) || e) }, origin);
    });
  });

  // Announced to '*' since we don't know the embedding extension's exact
  // origin until it sends us a message — safe, since this ping carries no
  // sensitive data, just an announcement that we're ready to receive one.
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'keetar-picker-ready' }, '*');
  }
})();
</script>
</body>
</html>
