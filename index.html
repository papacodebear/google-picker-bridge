<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Google Drive Picker</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
</style>
</head>
<body>
<script>
(function () {
  // Bridges a browser extension (moz-extension:// / chrome-extension://
  // origin) to Google's Picker widget, which this page loads the normal,
  // fully-documented way (live from apis.google.com) — no vendoring, no
  // interception. That's deliberate: the REMOTE_SCRIPT restriction the
  // extension itself works around (see google-picker-offline-loader) is
  // about code shipped *inside* an extension bundle, not an external
  // website the extension merely opens. This page exists specifically
  // because Google's Picker backend, confirmed live, accepts a real
  // https:// origin (and, oddly, chrome-extension://) but rejects
  // moz-extension:// outright with a genuine server-side 403 — this page
  // gives Firefox's side of that flow a real https:// origin to run from.
  //
  // Opened as a popup window (window.open), not embedded via <iframe> —
  // tried first, and genuinely broken: Picker's own client-side check
  // compares the origin it's told against window.location.ancestorOrigins
  // (a real, browser-computed, unspoofable property of the actual frame-
  // nesting chain), which — nested under the extension's own page — always
  // reports the extension's real origin, no matter what this page claims.
  // That's incompatible with also needing to present a real https://
  // origin to Google's *server*-side check; no single value satisfies
  // both. A popup has no ancestors at all — window.location.ancestorOrigins
  // is empty, so that check is skipped entirely (it's explicitly guarded
  // on ancestorOrigins.length > 0), and this page's own real https://
  // origin satisfies the server-side check with nothing left to conflict.
  //
  // Protocol (window.postMessage, both directions):
  //   -> {type: 'keetar-picker-show', accessToken, developerKey}
  //      Sent repeatedly by the opener until acknowledged — this page
  //      doesn't announce its own readiness via window.opener, since
  //      window.opener is simply absent on Firefox for a popup opened
  //      from a privileged extension page (confirmed live), evidently a
  //      deliberate boundary against letting less-trusted opened content
  //      reach back into extension-privileged code.
  //   <- {type: 'keetar-picker-started'}                            (on first accepted show-request)
  //   <- {type: 'keetar-picker-result', fileId?, name?}             (on pick/cancel)
  //   <- {type: 'keetar-picker-error', message}                     (on failure)
  //
  // Trust model: incoming messages are checked against an extension-scheme
  // origin before being acted on. Replies always go back via
  // event.source.postMessage(data, event.origin) — both browser-verified,
  // unspoofable properties of the received message — rather than a
  // hardcoded target, so this works correctly for whichever specific
  // extension ID/browser actually opened it without needing to know that
  // in advance.

  function isTrustedOrigin(origin) {
    return origin.indexOf('chrome-extension://') === 0 || origin.indexOf('moz-extension://') === 0;
  }

  var pickerApiPromise = null;
  function loadPickerApi() {
    if (!pickerApiPromise) {
      pickerApiPromise = new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = 'https://apis.google.com/js/api.js';
        script.onload = function () {
          window.gapi.load('picker', { callback: resolve, onerror: reject });
        };
        script.onerror = function () {
          reject(new Error('failed to load https://apis.google.com/js/api.js'));
        };
        document.head.appendChild(script);
      });
    }
    return pickerApiPromise;
  }

  // The opener resends its show-request on an interval until acknowledged
  // (see the protocol note above) — accept only the first one per page
  // load, since PickerBuilder/setVisible(true) should only ever run once.
  var handling = false;

  window.addEventListener('message', function (event) {
    if (!isTrustedOrigin(event.origin) || !event.data || event.data.type !== 'keetar-picker-show') {
      return;
    }
    if (handling) {
      return;
    }
    handling = true;

    var accessToken = event.data.accessToken;
    var developerKey = event.data.developerKey;
    var source = event.source;
    var origin = event.origin;

    source.postMessage({ type: 'keetar-picker-started' }, origin);

    function reply(message) {
      source.postMessage(message, origin);
      window.close();
    }

    loadPickerApi().then(function () {
      var picker = window.google.picker;
      var view = new picker.DocsView(picker.ViewId.DOCS).setIncludeFolders(false).setSelectFolderEnabled(false);
      new picker.PickerBuilder()
        .addView(view)
        .setOAuthToken(accessToken)
        .setDeveloperKey(developerKey)
        .setCallback(function (data) {
          if (data.action === picker.Action.PICKED) {
            var doc = data.docs && data.docs[0];
            reply({ type: 'keetar-picker-result', fileId: doc ? doc.id : undefined, name: doc ? doc.name : undefined });
          } else if (data.action === picker.Action.CANCEL) {
            reply({ type: 'keetar-picker-result', fileId: undefined });
          }
        })
        .build()
        .setVisible(true);
    }).catch(function (e) {
      reply({ type: 'keetar-picker-error', message: String((e && e.message) || e) });
    });
  });
})();
</script>
</body>
</html>
